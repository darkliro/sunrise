why = "A multiblock validates its shape without a framework of its own: Pattern reads layers of characters bottom first, Legend says what each character accepts (any, air, a block, one exact state, a block tag) and may name a role, and matches answers a PatternMatch only when every cell is available and accepted. The game-facing read is matches_level, which takes a LevelRef and its Host, the same reads the rest of the mod uses; matches takes a PatternWorld for a caller without a Host, such as a unit test. PatternPlacement pairs a StructureRotation with a mirror and derives Wire. A cell position the level cannot answer, an origin a cell would carry outside i32, and a pattern larger than an i32 position ends the match or the constructor instead of panicking or reading another cell. It replaces each mod writing its own shape validator."
migrate = "New surface: nothing to change. Rebuild against the current SDK to name it."
