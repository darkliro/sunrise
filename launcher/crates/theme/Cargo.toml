[package]
name = "sunrise-launcher-theme"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Shield-1.0.0"
description = "Sunrise's design tokens, fonts and icons for the launcher; tokens.css must match the game's. Copied from the game's crate so the launcher can leave the game repository."
publish = false

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
