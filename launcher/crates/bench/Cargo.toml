[package]
name = "sunrise-launcher-bench"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Shield-1.0.0"
description = "The benchmark report format (docs/benchmark-report.md), read by the perf platform. Copied from the game's crate so the launcher can leave the game repository."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sunrise-launcher-system = { path = "../system" }

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
