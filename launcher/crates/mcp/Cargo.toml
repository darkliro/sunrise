[package]
name = "sunrise-launcher-mcp"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "The Model Context Protocol for sunrise-launcher mcp. Copied from the game's crate so the launcher can leave the game repository."
publish = false

[dependencies]
serde_json = "1"

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
