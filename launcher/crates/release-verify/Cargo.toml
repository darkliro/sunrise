[package]
name = "sunrise-launcher-release-verify"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Checks the signed checksums of game builds, mod SDKs and prebuilt native builds before an install: the verifying half of the game's sunrise-release-sign, copied so the launcher can leave the game repository."
publish = false

[dependencies]
ring = "0.17"
base64 = "0.22"

[features]
# Signing with a generated key, for the launcher's tests only.
signing = []

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
