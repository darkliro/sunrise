[package]
name = "sunrise-launcher-resolver"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Minecraft server SRV redirects, so the launcher pings where the game connects. From sunrise-protocol's resolver. Copied from the game's crate so the launcher can leave the game repository."
publish = false

[dependencies]
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3.4"

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
