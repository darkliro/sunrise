[package]
name = "sunrise-launcher-nbt"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Java Edition NBT for level.dat and servers.dat, without SNBT. From sunrise-core's nbt. Copied from the game's crate so the launcher can leave the game repository."
publish = false

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
