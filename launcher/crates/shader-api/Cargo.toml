[package]
name = "sunrise-launcher-shader-api"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Sunrise's own shader packs (WGSL, .sshader): the format and the check a registry pack passes. Copied from the game's crate so the launcher can leave the game repository."
publish = false

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
png = "0.18"
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
