[package]
name = "sunrise-launcher-friends"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Play with Friends invite codes, read as the game reads them; the game does the joining. From sunrise-friends. Copied from the game's crate so the launcher can leave the game repository."
publish = false

[dependencies]
sha2 = "0.10"

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
