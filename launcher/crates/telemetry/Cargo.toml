[package]
name = "sunrise-launcher-telemetry"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Opt-in data collection: the consent, the payloads, the outbox and its upload; the format the game and the telemetry server read. Copied from the game's crate so the launcher can leave the game repository."
publish = false

[dependencies]
sunrise-launcher-addresses = { path = "../addresses" }
sunrise-launcher-system = { path = "../system" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.9"
getrandom = "0.3"
ureq = { version = "2", default-features = false, features = ["tls"] }

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
