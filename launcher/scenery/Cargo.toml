[package]
name = "sunrise-launcher-scenery"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Sunrise launcher's scenery: the sunset scene, painted skies, rain and frosted glass"
publish = false

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.13" }
sunrise-launcher-theme = { path = "../crates/theme" }
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
